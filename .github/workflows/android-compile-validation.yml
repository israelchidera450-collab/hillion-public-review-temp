# Release signing secrets are checked on branch pushes; never expose their values in logs.
name: HILLION Android compile verification

on:
  workflow_dispatch:
  push:
    branches:
      - hillion-complete-implementation-2026-11-21
  pull_request:
    branches:
      - main

jobs:
  android-debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Bootstrap pinned on-device AI engine
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: bash scripts/setup-native-ai.sh
      - name: Create temporary CI-only debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Install web dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Synchronise Capacitor
        run: npx cap sync android
      - name: Compile Android debug APK (CI debug key only)
        working-directory: android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Verify APK package and signature presence
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
      - name: Archive CI-only debug APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: HILLION-CI-DEBUG-APK-NOT-FOR-UPGRADE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare permanent release signing key
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          HILLION_RELEASE_KEYSTORE_BASE64: ${{ secrets.HILLION_RELEASE_KEYSTORE_BASE64 }}
          HILLION_RELEASE_STORE_PASSWORD: ${{ secrets.HILLION_RELEASE_STORE_PASSWORD }}
          HILLION_RELEASE_KEY_ALIAS: ${{ secrets.HILLION_RELEASE_KEY_ALIAS }}
          HILLION_RELEASE_KEY_PASSWORD: ${{ secrets.HILLION_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$HILLION_RELEASE_KEYSTORE_BASE64" ] || [ -z "$HILLION_RELEASE_STORE_PASSWORD" ] || [ -z "$HILLION_RELEASE_KEY_ALIAS" ] || [ -z "$HILLION_RELEASE_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Permanent signing secrets are not configured. No release APK will be produced."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/hillion-release.keystore"
          printf '%s' "$HILLION_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$HILLION_RELEASE_STORE_PASSWORD" -alias "$HILLION_RELEASE_KEY_ALIAS" >/dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Compile permanently signed release APK
        if: steps.release_signing.outputs.available == 'true'
        working-directory: android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          HILLION_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/hillion-release.keystore
          HILLION_RELEASE_STORE_PASSWORD: ${{ secrets.HILLION_RELEASE_STORE_PASSWORD }}
          HILLION_RELEASE_KEY_ALIAS: ${{ secrets.HILLION_RELEASE_KEY_ALIAS }}
          HILLION_RELEASE_KEY_PASSWORD: ${{ secrets.HILLION_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Verify permanently signed release APK
        if: steps.release_signing.outputs.available == 'true'
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Archive permanently signed release APK
        if: steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HILLION-ANDROID-RELEASE
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
