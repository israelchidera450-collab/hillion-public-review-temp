name: HILLION implementation validation

on:
  pull_request:
    branches:
      - main

jobs:
  web-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static lint checks
        run: npm run lint
      - name: Detect exact duplicate source files
        run: node scripts/check-source-duplicates.mjs
      - name: Run automated tests
        run: npm test
      - name: Build production web app
        run: npm run build
